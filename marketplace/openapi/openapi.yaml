openapi: 3.0.3

info:
  title: Marketplace API
  version: 1.0.0
  description: API for managing marketplace products and orders.

servers:
  - url: http://localhost:3000
    description: Local development server

security: []

paths:
  #----------------
  #     PRODUCTS
  # ---------------
  /products:
    #
    # Get Products
    #
    get:
      operationId: getProducts
      summary: Get products
      description: Returns a paginated list of marketplace products.

      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of products to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

        - name: cursor
          in: query
          required: false
          description: Opaque cursor token received from the previous page. Clients must not interpret or modify this value.
          schema:
            type: string

      responses:
        "200":
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: object

                required:
                  - items
                  - next_cursor

                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"

                  next_cursor:
                    type: string
                    nullable: true
                    description: Opaque cursor token for retrieving the next page. Null means there are no more pages.
                    example: "eyJpZCI6InByb2QtMSJ9"

        "400":
          description: Invalid query parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

    post:
      operationId: createProduct
      summary: Create product
      description: Creates a new product.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProduct"

      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

        "400":
          description: Invalid product data
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  #==========================================================================================
  /products/{id}:
    #
    # Get Product By ID
    #
    get:
      operationId: getProductById
      summary: Get product by ID
      description: Returns a single marketplace product by its ID.

      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the product.
          schema:
            type: string

      responses:
        "200":
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

        "404":
          description: Product not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  #----------------
  #     ORDERS
  # ---------------

  /orders:
    post:
      operationId: createOrder
      summary: Create order
      description: Creates a new marketplace order.

      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key used to make order creation idempotent. Repeating a request with the same key and the same request body returns the same response instead of creating another order.
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"

      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

        "400":
          description: Invalid order data or missing required headers
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  #==========================================================================================
  /orders/{id}:
    get:
      operationId: getOrderById
      summary: Get order by ID
      description: Returns a single marketplace order by its ID.

      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the order.
          schema:
            type: string

      responses:
        "200":
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

        "404":
          description: Order not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

#----------------
#     COMPONENTS
# ---------------
components:
  schemas:
    # ----------------
    #   Product Entity
    # ----------------
    Product:
      type: object

      required:
        - id
        - name
        - price_cents

      properties:
        id:
          type: string
          example: "prod-1"

        name:
          type: string
          example: "Mechanical Keyboard"

        price_cents:
          type: integer
          minimum: 0
          example: 8900

    # ----------------
    #   Create Product Entity
    # ----------------
    CreateProduct:
      type: object

      required:
        - name
        - price_cents

      properties:
        name:
          type: string
          minLength: 1
          example: "Mechanical Keyboard"

        price_cents:
          type: integer
          minimum: 0
          example: 8900

    OrderItem:
      type: object

      required:
        - product_id
        - quantity

      properties:
        product_id:
          type: string
          example: "prod-1"

        quantity:
          type: integer
          minimum: 1
          example: 2

    CreateOrder:
      type: object

      required:
        - items

      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"

    Order:
      type: object

      required:
        - id
        - items
        - total_cents
        - status

      properties:
        id:
          type: string
          example: "order-1"

        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"

        total_cents:
          type: integer
          minimum: 0
          example: 17800

        status:
          type: string
          enum:
            - created
          example: "created"

    # ----------------
    #   Problem Entity
    # ----------------
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance

      properties:
        type:
          type: string
          format: uri
          description: URI identifying the type of the problem.

        title:
          type: string
          description: Short human-readable summary of the problem.

        status:
          type: integer
          description: HTTP status code.
          example: 400

        detail:
          type: string
          description: Human-readable explanation of the specific problem.

        instance:
          type: string
          description: URI identifying the specific occurrence of the problem.
          example: "/products"
